<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Futebol Broadcast • PRISM v4</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#060b16;color:#fff;font-family:Arial,Helvetica,sans-serif} .editor{background:#101b2d;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}.editor label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#c7d8ec}.editor input{padding:9px;background:#23324b;color:#fff;border:1px solid #49617d;border-radius:5px;max-width:220px}.editor button{padding:11px 16px;border:0;background:#4ec7fa;color:#071221;font-weight:800;border-radius:5px;cursor:pointer}.hint{width:100%;font-size:12px;color:#a9bdd8}.viewport{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#020916}.stage{container-type:size;position:absolute;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 76%,#17415a 0%,#0b2038 35%,#040b19 76%,#02050e 100%)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#009dff1b,transparent 38%,transparent 62%,#ff405d1a),repeating-linear-gradient(0deg,transparent 0 6.2%,#ffffff07 6.3% 6.4%);pointer-events:none}.stadium{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 86%,#208b7770,transparent 43%),radial-gradient(ellipse at 50% 38%,#37648622,transparent 70%)}.stands{position:absolute;left:-10%;top:28%;width:120%;height:44%;border-radius:50%;border-top:2cqh solid #abc9e219;box-shadow:0 -3cqh 8cqh #6c9dd316,0 5cqh 4cqh #0009;transform:perspective(50cqw) rotateX(13deg)}.pitch{position:absolute;left:-20%;width:140%;bottom:-33%;height:66%;border-radius:50% 50% 0 0;background:repeating-linear-gradient(90deg,#0a3b38 0 9%,#0e4840 9% 18%);transform:perspective(70cqw) rotateX(42deg);border-top:0.3cqh solid #a7f4e263;filter:brightness(.7)}.pitch:after{content:"";position:absolute;inset:18% 28%;border:0.2cqh solid #c8ffff28;border-radius:50%}.flood{position:absolute;top:-16%;width:42%;height:53%;filter:blur(2cqw);opacity:.55;animation:pulse 8s ease-in-out infinite}.flood.l{left:-16%;background:radial-gradient(ellipse,#8cddff,transparent 65%)}.flood.r{right:-16%;background:radial-gradient(ellipse,#ff94a7,transparent 65%);animation-delay:-4s}.scan{position:absolute;inset:-30%;background:conic-gradient(from 0deg at 50% 55%,transparent 0 34%,#48bfff12 39%,transparent 44% 79%,#ff537c0d 83%,transparent 88%);animation:turn 8s linear infinite}.orbit{position:absolute;left:50%;top:53%;width:62cqw;height:62cqw;border-radius:50%;border:.16cqw solid #7ddfff35;transform:translate(-50%,-50%);box-shadow:0 0 3cqw #3ebdff22,inset 0 0 2cqw #1aa7ff17;animation:orbit 8s linear infinite}.orbit.two{width:75cqw;height:75cqw;border-color:#ff6d8b25;animation-direction:reverse}.arc{position:absolute;top:51%;height:0.35cqh;width:48%;filter:drop-shadow(0 0 1.2cqw currentColor);opacity:.7;animation:arc 8s ease-in-out infinite}.arc.l{left:-4%;color:#43c9ff;background:linear-gradient(90deg,transparent,currentColor,transparent)}.arc.r{right:-4%;color:#ff5678;background:linear-gradient(90deg,transparent,currentColor,transparent);animation-delay:-4s}.bars{position:absolute;inset:0;pointer-events:none}.bar{position:absolute;height:.28cqh;width:32%;background:linear-gradient(90deg,transparent,#8ddfff77,transparent);animation:sweep 8s linear infinite}.bar:nth-child(1){top:24%;left:4%}.bar:nth-child(2){top:74%;right:2%;animation-delay:-3s;background:linear-gradient(90deg,transparent,#ff719477,transparent)}.bar:nth-child(3){top:88%;left:15%;animation-delay:-5s}.particles{position:absolute;inset:0}.particle{position:absolute;width:.22cqw;height:.22cqw;border-radius:50%;background:#bdeaff;box-shadow:0 0 1cqw #49bfff;animation:drift 8s linear infinite}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 11cqw #01040fd9;pointer-events:none}.upper{position:absolute;top:4%;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;font-size:1.2cqw;letter-spacing:.22em;font-weight:800;color:#d7eaff}.live{background:#ec3359;padding:.6cqh 1.2cqw;letter-spacing:.13em;box-shadow:0 0 2cqw #ed315755}.live:before{content:"● ";animation:blink 8s steps(1,end) infinite}.title{position:absolute;top:14%;left:0;width:100%;text-align:center;font-size:4.5cqw;font-weight:900;letter-spacing:.06em;text-shadow:0 0 2cqw #3c9dff75}.title:after{content:"";display:block;margin:1.2cqh auto 0;width:27%;height:.35cqh;background:linear-gradient(90deg,transparent,#5cd6ff,transparent);animation:pulse 8s ease-in-out infinite}.match{position:absolute;top:34%;left:8%;width:84%;height:41%;display:grid;grid-template-columns:minmax(0,1fr) 17% minmax(0,1fr);gap:1%;align-items:center}.team{min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh}.logo-panel{height:27cqh;width:25cqw;max-width:100%;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#1b416166,#07172b99);border:.13cqw solid #8edcff4d;clip-path:polygon(9% 0,91% 0,100% 18%,100% 82%,91% 100%,9% 100%,0 82%,0 18%);box-shadow:inset 0 0 4cqw #3ab6ff1b}.away .logo-panel{border-color:#ff8aa258;background:linear-gradient(225deg,#55223766,#07172b99)}.crest{display:block;width:100%;height:100%;max-width:17cqw;max-height:24cqh;object-fit:contain;object-position:center;filter:drop-shadow(0 .6cqw 1cqw #000a);animation:logoFloat 8s ease-in-out infinite}.away .crest{animation-delay:-4s}.placeholder{font-size:7cqw;font-weight:900;color:#9bb7d4}.team-name{font-size:2.1cqw;line-height:1.08;text-align:center;font-weight:900;text-transform:uppercase;text-shadow:0 .2cqw .7cqw #000;max-width:100%;overflow-wrap:anywhere}.versus{font-weight:900;font-size:5.3cqw;text-align:center;font-style:italic;text-shadow:0 0 2cqw #52cfff;animation:vsGlow 8s ease-in-out infinite}.ticker{position:absolute;bottom:11%;left:13%;width:74%;padding:1.5cqh 2cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;background:linear-gradient(90deg,#0b2845e8,#091525ed,#302037e0);border-top:.2cqh solid #5fcef7a1;border-bottom:.12cqh solid #7ca7ca44;box-shadow:0 1cqh 4cqh #0009;font-size:1.55cqw;font-weight:800}.ticker span{min-width:0;text-align:center;overflow-wrap:anywhere}.ticker .sep{width:.1cqw;align-self:stretch;background:#6cc9f5;flex:none}.bottom{position:absolute;bottom:4.1%;width:100%;text-align:center;font-size:1.25cqw;letter-spacing:.28em;color:#c1e7ff;font-weight:800;animation:message 8s ease-in-out infinite}.edge{position:absolute;top:0;bottom:0;width:.55cqw;background:linear-gradient(#16c5ff,transparent 70%)}.edge.left{left:0}.edge.right{right:0;background:linear-gradient(#ff4768,transparent 70%)}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes orbit{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(1)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.045)}}@keyframes arc{0%,100%{opacity:.25;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1.07)}}@keyframes sweep{0%,100%{transform:translateX(-18%);opacity:.15}50%{transform:translateX(60%);opacity:.8}}@keyframes drift{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(1.5cqw,-2cqh);opacity:.85}}@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8cqh)}}@keyframes vsGlow{0%,100%{filter:brightness(.85)}50%{filter:brightness(1.35)}}@keyframes message{0%,100%{opacity:.7}50%{opacity:1}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
body.broadcast{overflow:hidden}body.broadcast .editor{display:none}body.broadcast .viewport{width:100vw;height:100vh;aspect-ratio:auto}

/* Broadcast v3: movimentos de câmara em paralaxe, com ciclos perfeitamente periódicos */
.stage{perspective:110cqw;transform-style:preserve-3d;background:radial-gradient(ellipse at 50% 78%,#164561 0%,#09192f 42%,#01050e 100%)}
.stadium,.stands,.pitch,.flood,.depth-grid{will-change:transform;animation:cameraDepth 8s ease-in-out infinite;transform-origin:50% 65%}
.stands{animation-name:cameraMid;filter:drop-shadow(0 1.4cqh 2cqh #000b)}
.pitch{animation-name:cameraNear}
.flood{animation-name:cameraFar}
.depth-grid{position:absolute;inset:-15%;opacity:.32;background:repeating-linear-gradient(90deg,transparent 0 7.8%,#6acbff1c 7.9% 8%),repeating-linear-gradient(0deg,transparent 0 11%,#b8eaff0e 11.1% 11.2%);mask-image:linear-gradient(transparent 8%,#000 45%,transparent 90%);animation-name:cameraFar}
@keyframes cameraDepth{0%,100%{transform:translate3d(0,0,0) scale(1.035)}25%{transform:translate3d(-.5cqw,.1cqh,0) scale(1.055)}50%{transform:translate3d(0,-.25cqh,0) scale(1.07)}75%{transform:translate3d(.5cqw,.1cqh,0) scale(1.055)}}
@keyframes cameraFar{0%,100%{transform:translate3d(0,0,0) scale(1.05)}25%{transform:translate3d(-.85cqw,.15cqh,0) scale(1.07)}50%{transform:translate3d(0,-.35cqh,0) scale(1.09)}75%{transform:translate3d(.85cqw,.15cqh,0) scale(1.07)}}
@keyframes cameraMid{0%,100%{transform:perspective(50cqw) rotateX(13deg) translateX(0) scale(1.02)}25%{transform:perspective(50cqw) rotateX(13deg) translateX(-.6cqw) scale(1.05)}50%{transform:perspective(50cqw) rotateX(13deg) translateY(-.3cqh) scale(1.065)}75%{transform:perspective(50cqw) rotateX(13deg) translateX(.6cqw) scale(1.05)}}
@keyframes cameraNear{0%,100%{transform:translateX(0) scale(1.02)}25%{transform:translateX(-1.2cqw) scale(1.065)}50%{transform:translateY(-.4cqh) scale(1.09)}75%{transform:translateX(1.2cqw) scale(1.065)}}
.match{transform-style:preserve-3d;animation:heroCamera 8s ease-in-out infinite;will-change:transform}
@keyframes heroCamera{0%,100%{transform:perspective(95cqw) rotateY(0deg) translateY(0)}25%{transform:perspective(95cqw) rotateY(-1.5deg) translateY(-.25cqh)}50%{transform:perspective(95cqw) rotateY(0deg) translateY(-.55cqh)}75%{transform:perspective(95cqw) rotateY(1.5deg) translateY(-.25cqh)}}
.logo-panel{box-shadow:inset 0 0 2cqw #9ddcff12,0 1.4cqh 3cqw #0009,0 0 2cqw #39baff19;transform-style:preserve-3d}
.crest{max-width:78%!important;max-height:78%!important;width:78%!important;height:78%!important;object-fit:contain!important;object-position:center!important}
.title{max-width:92%;left:4%;overflow-wrap:anywhere;line-height:1.04;text-wrap:balance;text-shadow:0 .25cqh .8cqw #000,0 0 2cqw #23b7ff6e}
.light-sweep{position:absolute;inset:-40%;pointer-events:none;mix-blend-mode:screen;opacity:.28;background:conic-gradient(from 45deg at 50% 50%,transparent 0deg,transparent 67deg,#2ac8ff24 84deg,transparent 102deg,transparent 210deg,#ff507c20 225deg,transparent 246deg);animation:rotateSweep 8s linear infinite}
@keyframes rotateSweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.broadcast-lines{position:absolute;inset:0;pointer-events:none;opacity:.23;background:repeating-linear-gradient(0deg,transparent 0 1.8cqh,#b5e9ff13 1.85cqh 1.9cqh);mask-image:linear-gradient(transparent,#000 25%,#000 80%,transparent);animation:lineMotion 8s linear infinite}
@keyframes lineMotion{from{background-position:0 0}to{background-position:0 57.6cqh}}
@media(prefers-reduced-motion:reduce){/* transmissão mantém movimento quando solicitado pelo operador */}

/* Broadcast camera: periodic 8-second dolly and subtle parallax, seamless at boundaries. */
.stadium{transform-origin:50% 65%;animation:cameraDolly 8s ease-in-out infinite}
.stands{animation:cameraStands 8s ease-in-out infinite}
@keyframes cameraDolly{0%,100%{transform:scale(1) translate3d(0,0,0)}25%{transform:scale(1.045) translate3d(-.6%,.3%,0)}50%{transform:scale(1.075) translate3d(0,-.5%,0)}75%{transform:scale(1.045) translate3d(.6%,.3%,0)}}
@keyframes cameraStands{0%,100%{transform:perspective(50cqw) rotateX(13deg) translateX(0) scale(1)}50%{transform:perspective(50cqw) rotateX(15deg) translateX(1%) scale(1.035)}}
/* Metallic broadcast overlay: animated studio light reflections */
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 25%,#a3dcff09 44%,#ffffff15 50%,#8ecfff08 56%,transparent 75%);background-size:220% 100%;animation:studioGlint 8s ease-in-out infinite;z-index:4}
@keyframes studioGlint{0%,100%{background-position:100% 0;opacity:.12}45%{opacity:.65}50%{background-position:0 0;opacity:.7}55%{opacity:.65}}
.logo-panel{transform:perspective(60cqw) rotateY(0deg);animation:panelPerspective 8s ease-in-out infinite;box-shadow:inset 0 0 3cqw #5bd2ff19,0 1cqh 3cqh #0008}
.away .logo-panel{animation-delay:-4s}
@keyframes panelPerspective{0%,100%{transform:perspective(60cqw) rotateY(0deg) translateY(0)}50%{transform:perspective(60cqw) rotateY(4deg) translateY(-.6cqh)}}
.crest{width:100%;height:100%;max-width:17cqw;max-height:24cqh;object-fit:contain;object-position:center}

/* Relógio broadcast: hora local do computador que executa o PRISM */
.broadcast-clock{position:absolute;right:2.3%;bottom:2.3%;z-index:80;display:flex;align-items:center;gap:.7cqw;padding:.62cqh 1.1cqw;background:linear-gradient(110deg,#071326ed,#173b59e8);border:1px solid #72caff78;border-left:3px solid #34c5ff;box-shadow:0 0 2cqw #0009, inset 0 1px #ffffff24;border-radius:.25cqw;font-variant-numeric:tabular-nums;font-size:clamp(12px,1.42cqw,30px);font-weight:800;letter-spacing:.07em;line-height:1.2;white-space:nowrap}
.broadcast-clock .clock-dot{width:.43cqw;height:.43cqw;border-radius:50%;background:#35d9ff;box-shadow:0 0 .7cqw #35d9ff;animation:clockPulse 2s ease-in-out infinite}
@keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.45}}
</style></head><body class="broadcast"><div class="viewport"><main class="stage"><div class="depth-grid"></div><div class="stadium"></div><div class="stands"></div><div class="pitch"></div><div class="flood l"></div><div class="flood r"></div><div class="scan"></div><div class="orbit"></div><div class="orbit two"></div><div class="arc l"></div><div class="arc r"></div><div class="bars"><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="particles" id="particles"></div><div class="light-sweep"></div><div class="broadcast-lines"></div><div class="vignette"></div><div class="edge left"></div><div class="edge right"></div><div class="upper"><span id="eyebrowText">FUTEBOL • PRÉ-JOGO</span><span class="live">EM DIRETO</span></div><div class="title" id="headlineText">TRANSMISSÃO AO VIVO</div><div class="match"><div class="team home"><div class="logo-panel" id="homePanel"><img alt="Emblema equipa da casa" class="crest" id="homeCrest" src="logos/casa.png"/></div><div class="team-name" id="homeText">CADAVAL</div></div><div class="versus">VS</div><div class="team away"><div class="logo-panel" id="awayPanel"><img alt="Emblema equipa visitante" class="crest" id="awayCrest" src="logos/visitante.png"/></div><div class="team-name" id="awayText">CD MAFRA</div></div></div><div class="ticker"><span id="venueText">ESTÁDIO MUNICIPAL</span><i class="sep"></i><span id="dateText">25 OUT 2026 · 16:00</span></div><div class="bottom" id="messageText">A TRANSMISSÃO COMEÇA BREVEMENTE</div><div aria-label="Hora atual" class="broadcast-clock"><i class="clock-dot"></i><time id="broadcastClock">--:--:--</time></div></main></div><script id="clock-runtime">
(function(){
 const clock=document.getElementById('broadcastClock');
 if(!clock)return;
 const fmt=new Intl.DateTimeFormat('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
 function tick(){clock.textContent=fmt.format(new Date());}
 tick();setInterval(tick,250);
})();
</script><script>(()=>{
const keys={homeName:'homeText',awayName:'awayText',venue:'venueText',date:'dateText',eyebrow:'eyebrowText',headline:'headlineText',message:'messageText'};
let last='';
async function refresh(){try{
const response=await fetch('./config.json?t='+Date.now(),{cache:'no-store'});
if(!response.ok)throw new Error('HTTP '+response.status);
const cfg=await response.json();const stamp=JSON.stringify(cfg);if(stamp===last)return;last=stamp;
for(const [key,id] of Object.entries(keys))if(typeof cfg[key]==='string')document.getElementById(id).textContent=cfg[key];
for(const [key,id] of [['homeLogo','homeCrest'],['awayLogo','awayCrest']]){
if(typeof cfg[key]!=='string')continue;
const el=document.getElementById(id);const value=cfg[key].trim();
if(!value){el.style.display='none';continue;}
if(!/^(?:logos\/[-\w.]+\.(?:png|jpg|jpeg|webp|svg)|data:image\/(?:png|jpeg|webp);base64,[a-zA-Z0-9+/=]+)$/.test(value))continue;
el.style.display='block';if(el.dataset.path!==value){el.dataset.path=value;el.src=value.startsWith('data:')?value:value+'?v='+Date.now();}
}
}catch(err){console.warn('A manter dados anteriores:',err.message)}}
refresh();setInterval(refresh,15000);
})();</script></body></html>
